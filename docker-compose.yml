version: '3.8'

services:
  backend:
    build:
      context: ./protohub-backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=super_secret_for_production_only_change_me
    volumes:
      - backend_data:/app/prisma
    restart: unless-stopped

  web:
    build:
      context: ./protohub-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_WS_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
